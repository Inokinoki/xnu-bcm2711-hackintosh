name: userland-arm64

# Builds the macOS 13.5 userland for the BCM2711 kernel as plain arm64 (no arm64e/PAC) for the
# Cortex-A72 (docs/userland-plan.md). Stage A: fetch the pinned Apple sources, check the toolchain and
# the arm64 gate. Then libraries in dependency order: libsystem_kernel first.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "userland/**"
      - "tools/check-arm64-plain.sh"
      - ".github/workflows/userland-arm64.yml"

concurrency:
  group: userland-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --find mig

      - name: Fetch Apple sources (macos-135 manifest)
        run: python3 -I userland/fetch-sources.py build/userland/src

      - name: Build and gate
        run: userland/build.sh build/userland

      - name: Deps for the xnu header roots (same as the kernel workflow)
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          # Xcode 15.x: the macOS 13.5 headers use the bridgeos availability macros that Xcode 16's SDK dropped
          XC=$(ls -d /Applications/Xcode_15*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"

      - name: xnu headers, Libsystem headers, mig
        run: userland/dxb-headers.sh build/userland/dxb

      - name: Libc and libmalloc headers
        run: userland/install-headers.sh build/userland/dxb build/userland/src Libc:Libc libmalloc:libmalloc libpthread:libsystem_pthread

      - name: libsystem_kernel
        run: userland/build-libsyscall.sh build/userland/dxb build/userland/root

      - name: dyld private headers
        run: |
          mkdir -p build/userland/dxb/fakeroot/usr/local/include
          cp -R build/userland/src/dyld/include/. build/userland/dxb/fakeroot/usr/local/include/

      - name: libsystem_platform
        id: platform
        continue-on-error: true
        run: userland/build-libplatform.sh build/userland/dxb build/userland/src build/userland/root

      - name: libsystem_pthread
        id: pthread
        continue-on-error: true
        env:
          LIB_EXTRA_CFLAGS: -include ${{ github.workspace }}/userland/include/pthread_shim.h
          LIB_EXTRA_SRC: ${{ github.workspace }}/userland/src/thread_self_restrict_stub.c
        run: userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root libpthread libsystem_pthread

      - name: libsystem_blocks
        id: blocks
        continue-on-error: true
        env:
          CXXSTD: "1"
        run: userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root libclosure Blocks

      - name: libkeymgr
        id: keymgr
        continue-on-error: true
        run: userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root keymgr libkeymgr.dylib

      - name: libcompiler_rt
        id: compiler_rt
        continue-on-error: true
        run: userland/build-compiler-rt.sh build/userland/root

      - name: Stand-ins for closed libraries
        id: stubs
        continue-on-error: true
        run: |
          userland/build-stub-lib.sh build/userland/root libsystem_trace

      - name: libsystem_c
        id: libc
        continue-on-error: true
        env:
          LIB_CFLAGS_VAR: WARNING_CFLAGS
          # Xcode 15's new linker rejects the duplicate $NOCANCEL definitions Libc's variants produce
          LIB_EXTRA_LDFLAGS: -ld_classic
        run: |
          # private headers of Libinfo that Libc includes
          cp build/userland/src/Libinfo/membership.subproj/membershipPriv.h build/userland/dxb/fakeroot/usr/local/include/
          cp build/userland/src/libclosure/Block_private.h build/userland/dxb/fakeroot/usr/local/include/
          userland/patch-libc.sh build/userland/src/Libc
          userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root Libc libsystem_c.dylib CR_LDFLAGS=

      - name: libsystem_malloc
        id: malloc
        continue-on-error: true
        env:
          LIB_EXTRA_CFLAGS: -DOS_VARIANT_RESOLVED=1 -DOS_VARIANT_NOTRESOLVED=1 -include ${{ github.workspace }}/userland/include/dyld_version_shim.h
        run: |
          userland/patch-libmalloc.sh build/userland/src/libmalloc
          userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root libmalloc libsystem_malloc

      - name: Static archives for dyld
        id: dyld_archives
        continue-on-error: true
        env:
          LIB_CFLAGS_VAR: WARNING_CFLAGS
        run: |
          VARIANT=dyld userland/build-libplatform.sh build/userland/dxb build/userland/src build/userland/root
          userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root libpthread "libpthread dyld"
          userland/patch-libc.sh build/userland/src/Libc
          userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root Libc Libc_dyld CR_LDFLAGS=
          find build/userland/root -name '*.a' | sort

      - name: dyld and libdyld
        id: dyld
        continue-on-error: true
        env:
          CXXSTD: "1"
          LIB_EXTRA_HDRS: ${{ github.workspace }}/userland/include-dyld
          LIB_EXTRA_CFLAGS: -include ${{ github.workspace }}/userland/include-dyld/dyld_compat.h
        run: |
          userland/patch-dyld.sh build/userland/src/dyld
          for t in dyld libdyld.dylib; do
            userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root dyld "$t" DYLD_LIBS_DIR="$PWD/build/userland/root/usr/local/lib/dyld" \
              DYLD_EXTRA_INC="-idirafter $PWD/build/userland/dxb/fakeroot/usr/local/include -idirafter $PWD/userland/include -idirafter $PWD/userland/include-dyld"
          done

      - name: libdispatch
        id: dispatch
        continue-on-error: true
        env:
          CXXSTD: "1"
          LIB_EXTRA_CFLAGS: -DOS_VARIANT_RESOLVED=1 -DOS_VARIANT_NOTRESOLVED=1 -DDISPATCH_SEND_ACTIVITY_IN_MSGV=0 -DDISPATCH_USE_DTRACE=0 -D_DARWIN_C_SOURCE -DOS_ATOMIC_CONFIG_MEMORY_ORDER_DEPENDENCY=1 -include ${{ github.workspace }}/build/userland/dxb/fakeroot/usr/include/time.h -include ${{ github.workspace }}/build/userland/src/libclosure/Block.h -I${{ github.workspace }}/build/userland/src/libdispatch
        run: |
          userland/build-libdispatch.sh build/userland/dxb build/userland/src build/userland/root

      - name: libsystem_m (openlibm)
        id: libm
        continue-on-error: true
        run: userland/build-libm.sh build/userland/libm build/userland/root

      - name: libxpc stand-in and Libc collections headers
        id: xpc
        continue-on-error: true
        run: |
          mkdir -p build/userland/dxb/fakeroot/usr/local/include/os
          cp build/userland/src/Libc/collections/PublicHeader/*.h build/userland/dxb/fakeroot/usr/local/include/os/
          userland/build-stub-lib.sh build/userland/root libxpc

      - name: libsystem_info
        id: info
        continue-on-error: true
        run: |
          userland/patch-libinfo.sh build/userland/src/Libinfo
          LIB_EXTRA_CFLAGS="$(for d in build/userland/src/Libinfo/*.subproj; do printf -- '-I%s ' "$PWD/$d"; done)" \
            userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root Libinfo Libinfo

      - name: libsystem_notify
        id: notify
        continue-on-error: true
        run: |
          # the project links /usr/local/lib/libCrashReporterClient.a
          mkdir -p build/userland/crc build/userland/root/usr/local/lib
          xcrun clang -target arm64-apple-macos13.0 -mcpu=cortex-a72 -Os -c userland/src/crashreporterclient.c -o build/userland/crc/crc.o
          xcrun ar rcs build/userland/root/usr/local/lib/libCrashReporterClient.a build/userland/crc/crc.o
          LIB_EXTRA_LDFLAGS="-L$PWD/build/userland/root/usr/local/lib" \
            userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root Libnotify libnotify

      - name: asl and CommonCrypto stand-ins
        id: stubs2
        continue-on-error: true
        run: |
          userland/build-stub-lib.sh build/userland/root libsystem_asl
          userland/build-stub-lib.sh build/userland/root libcommonCrypto

      - name: libcopyfile, libremovefile, libutil
        id: cmdlibs
        continue-on-error: true
        run: |
          rc=0
          cp build/userland/src/libutil/libutil.h build/userland/src/libutil/mntopts.h build/userland/dxb/fakeroot/usr/local/include/
          userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root copyfile copyfile || rc=1
          userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root removefile removefile || rc=1
          CXXSTD=1 userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root libutil util || rc=1
          exit $rc

      - name: libc++, libc++abi, libunwind (LLVM runtimes)
        id: llvm_runtimes
        continue-on-error: true
        run: |
          userland/build-libsystem.sh build/userland/root build/userland/stage
          userland/build-llvm-runtimes.sh build/userland/llvm build/userland/root build/userland/stage

      - name: libSystem umbrella
        id: libsystem
        continue-on-error: true
        run: userland/build-libsystem.sh build/userland/root

      - name: init (/sbin/launchd)
        id: init
        continue-on-error: true
        run: userland/build-init.sh build/userland/root

      - name: bash
        id: bash
        continue-on-error: true
        env:
          LIB_EXTRA_CFLAGS: -DCONF_HOSTTYPE=\"arm64\" -DCONF_OSTYPE=\"darwin22\" -DCONF_MACHTYPE=\"arm64-apple-darwin22\" -DCONF_VENDOR=\"apple\"
        run: userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root bash all

      - name: shell_cmds
        id: shell_cmds
        continue-on-error: true
        run: userland/build-commands.sh build/userland/dxb build/userland/src build/userland/root shell_cmds echo test sleep env kill pwd true false uname hostname id date printenv basename dirname which

      - name: file_cmds
        id: file_cmds
        continue-on-error: true
        run: userland/build-commands.sh build/userland/dxb build/userland/src build/userland/root file_cmds ls cp mv rm mkdir rmdir ln chmod touch df stat dd

      - name: text_cmds
        id: text_cmds
        continue-on-error: true
        run: userland/build-commands.sh build/userland/dxb build/userland/src build/userland/root text_cmds cat sed wc head tail sort tr cut

      - name: Gate on the whole root
        if: always()
        run: tools/check-arm64-plain.sh build/userland/root

      - name: Fail if a library step failed
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 -I -c 'import json,os,sys; s=json.loads(os.environ["STEPS"]); bad=[k for k,v in s.items() if v.get("outcome")=="failure"]; print("failed library steps:", bad); sys.exit(1 if bad else 0)'

      - name: Record sources
        run: cp build/userland/src/MANIFEST build/userland/root/MANIFEST

      - uses: actions/upload-artifact@v4
        with:
          name: userland-arm64-root
          path: build/userland/root/
          if-no-files-found: error
          retention-days: 14
