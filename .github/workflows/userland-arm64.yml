name: userland-arm64

# Builds the macOS 13.5 userland for the BCM2711 kernel as plain arm64 (no arm64e/PAC) for the
# Cortex-A72 (docs/userland-plan.md). Stage A: fetch the pinned Apple sources, check the toolchain and
# the arm64 gate. Then libraries in dependency order: libsystem_kernel first.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "userland/**"
      - "tools/check-arm64-plain.sh"
      - ".github/workflows/userland-arm64.yml"

concurrency:
  group: userland-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --find mig

      - name: Fetch Apple sources (macos-135 manifest)
        run: python3 -I userland/fetch-sources.py build/userland/src

      - name: Build and gate
        run: userland/build.sh build/userland

      - name: Deps for the xnu header roots (same as the kernel workflow)
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          # Xcode 15.x: the macOS 13.5 headers use the bridgeos availability macros that Xcode 16's SDK dropped
          XC=$(ls -d /Applications/Xcode_15*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"

      - name: xnu headers, Libsystem headers, mig
        run: userland/dxb-headers.sh build/userland/dxb

      - name: Libc and libmalloc headers
        run: userland/install-headers.sh build/userland/dxb build/userland/src Libc:Libc libmalloc:libmalloc libpthread:libsystem_pthread

      - name: libsystem_kernel
        run: userland/build-libsyscall.sh build/userland/dxb build/userland/root

      - name: dyld private headers
        run: |
          mkdir -p build/userland/dxb/fakeroot/usr/local/include
          cp -R build/userland/src/dyld/include/. build/userland/dxb/fakeroot/usr/local/include/

      - name: libsystem_platform
        id: platform
        continue-on-error: true
        run: userland/build-libplatform.sh build/userland/dxb build/userland/src build/userland/root

      - name: libsystem_pthread
        id: pthread
        continue-on-error: true
        env:
          LIB_EXTRA_CFLAGS: -include ${{ github.workspace }}/userland/include/pthread_shim.h
        run: userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root libpthread libsystem_pthread

      - name: libsystem_blocks
        id: blocks
        continue-on-error: true
        env:
          CXXSTD: "1"
        run: userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root libclosure Blocks

      - name: libkeymgr
        id: keymgr
        continue-on-error: true
        run: userland/build-xcode-lib.sh build/userland/dxb build/userland/src build/userland/root keymgr libkeymgr.dylib

      - name: Gate on the whole root
        if: always()
        run: tools/check-arm64-plain.sh build/userland/root

      - name: Fail if a library step failed
        if: always()
        run: |
          echo "platform=${{ steps.platform.outcome }} pthread=${{ steps.pthread.outcome }} blocks=${{ steps.blocks.outcome }} keymgr=${{ steps.keymgr.outcome }}"
          test "${{ steps.platform.outcome }}${{ steps.pthread.outcome }}${{ steps.blocks.outcome }}${{ steps.keymgr.outcome }}" = successsuccesssuccesssuccess

      - name: Record sources
        run: cp build/userland/src/MANIFEST build/userland/root/MANIFEST

      - uses: actions/upload-artifact@v4
        with:
          name: userland-arm64-root
          path: build/userland/root/
          if-no-files-found: error
          retention-days: 14
