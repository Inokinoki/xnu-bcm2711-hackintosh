name: userland-arm64

# Builds the macOS 13.5 userland for the BCM2711 kernel as plain arm64 (no arm64e/PAC) for the
# Cortex-A72. Stage A (docs/userland-plan.md): fetch the pinned Apple sources, check the toolchain
# and the arm64 gate. Later stages add the libraries and commands to userland/build.sh.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "userland/**"
      - "tools/check-arm64-plain.sh"
      - ".github/workflows/userland-arm64.yml"

concurrency:
  group: userland-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --find mig

      - name: Fetch Apple sources (macos-135 manifest)
        run: python3 -I userland/fetch-sources.py build/userland/src

      - name: Build and gate
        run: userland/build.sh build/userland

      - name: Record sources
        run: cp build/userland/src/MANIFEST build/userland/root/MANIFEST

      - uses: actions/upload-artifact@v4
        with:
          name: userland-arm64-root
          path: build/userland/root/
          if-no-files-found: error
          retention-days: 14
