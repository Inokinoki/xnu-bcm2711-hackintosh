name: dyld-cache

# Builds dyld's shared cache builder (dyld-1066.10, the version that shipped with macOS 13.5) as a host tool on a
# macOS runner. A later step turns the userland root's dylibs into /System/Library/dyld/dyld_shared_cache_arm64, so
# processes get a populated shared region and the kernel stops logging "check_np ... vm_shared_region_start_address()
# failed" for every exec (the region is empty without a cache).

on:
  workflow_dispatch:

jobs:
  builder:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dyld
        run: python3 -I userland/fetch-sources.py build/dyld-src dyld libplatform Libc xnu

      - name: Build dyld_shared_cache_builder
        id: build
        continue-on-error: true
        run: |
          XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=/Applications/Xcode_16.4.app
          sudo xcode-select -s "$XC"
          . userland/lib-env.sh >/dev/null 2>&1 || true
          cd build/dyld-src/dyld
          (grep -rl 'BSD.xcconfig' . --include='*.xcconfig' | while read -r f; do sed -i '' '/BSD.xcconfig/d' "$f"; done) || true
          SRCS=$GITHUB_WORKSPACE/build/dyld-src
          INC="-idirafter $PWD/include -idirafter $GITHUB_WORKSPACE/userland/include-dyld"
          for h in _simple.h CrashReporterClient.h; do
            f=$(find "$SRCS/libplatform" "$SRCS/Libc" -name "$h" 2>/dev/null | head -1)
            [ -z "$f" ] || INC="$INC -idirafter $(dirname "$f")"
          done
          for d in libkern EXTERNAL_HEADERS bsd osfmk; do INC="$INC -idirafter $SRCS/xnu/$d"; done
          # <System/sys/reason.h> style includes: the xnu tree under a System/ prefix
          mkdir -p "$GITHUB_WORKSPACE/build/sysinc/System"
          for pair in sys:bsd/sys machine:bsd/machine kern:bsd/kern uuid:bsd/uuid mach:osfmk/mach libkern:libkern; do
            ln -sfn "$SRCS/xnu/${pair#*:}" "$GITHUB_WORKSPACE/build/sysinc/System/${pair%%:*}"
          done
          INC="$INC -idirafter $GITHUB_WORKSPACE/build/sysinc"
          INC="$INC -idirafter $GITHUB_WORKSPACE/tools/dsc-shim"
          # the PrebuiltLoader hash script runs its own clang++: give it the same private header paths
          sed -i '' 's|-Ilsl \${DERIVED_FILE_DIR}|-Ilsl ${DYLD_EXTRA_INC} ${DERIVED_FILE_DIR}|' build-scripts/prebuilt-loader-hash.sh
          grep -q DYLD_EXTRA_INC build-scripts/prebuilt-loader-hash.sh
          BR="-D__API_AVAILABLE_PLATFORM_bridgeos(x)=bridgeos,introduced=x -D__API_UNAVAILABLE_PLATFORM_bridgeos=bridgeos,unavailable"
          INC="$INC $BR"
          # the stock tool needs the closed Bom framework: swap in our driver around the MRM interface
          cp "$GITHUB_WORKSPACE/tools/dsc-driver.cpp" cache-builder/dyld_shared_cache_builder.mm
          echo "include flags: $INC"
          SDKP=$(xcrun --sdk macosx --show-sdk-path)
          xcodebuild build -sdk macosx -target dyld_shared_cache_builder SDKROOT=macosx DYLD_EXTRA_INC="$INC" ARM_SDK="$SDKP" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=13.0 CODE_SIGN_IDENTITY=- GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS="\$(inherited) $INC" OTHER_CPLUSPLUSFLAGS="\$(inherited) $INC" \
            OBJROOT="$GITHUB_WORKSPACE/build/dsc.obj" SYMROOT="$GITHUB_WORKSPACE/build/dsc.sym" \
            RC_ProjectSourceVersion=1 RC_ProjectNameAndSourceVersion=dyld-1066.10 \
            2>&1 | tee "$GITHUB_WORKSPACE/build/dsc-build.log" | tail -n 400
          test -x "$GITHUB_WORKSPACE/build/dsc.sym/Release/dyld_shared_cache_builder" || test -x "$GITHUB_WORKSPACE/build/dsc.sym/Debug/dyld_shared_cache_builder"

      - name: Errors
        if: always()
        run: grep -E "error:|fatal error|\*\* BUILD" build/dsc-build.log | sort | uniq -c | sort -rn | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsc-build-log
          path: build/dsc-build.log
          retention-days: 7
