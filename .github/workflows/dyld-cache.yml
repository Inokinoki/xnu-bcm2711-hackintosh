name: dyld-cache

# Builds dyld's shared cache builder (dyld-1066.10, the version that shipped with macOS 13.5) as a host tool on a
# macOS runner. A later step turns the userland root's dylibs into /System/Library/dyld/dyld_shared_cache_arm64, so
# processes get a populated shared region and the kernel stops logging "check_np ... vm_shared_region_start_address()
# failed" for every exec (the region is empty without a cache).

on:
  workflow_dispatch:

jobs:
  builder:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dyld
        run: python3 -I userland/fetch-sources.py build/dyld-src dyld libplatform Libc xnu AvailabilityVersions

      - name: Build dyld_shared_cache_builder
        id: build
        continue-on-error: true
        run: |
          XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=/Applications/Xcode_16.4.app
          sudo xcode-select -s "$XC"
          . userland/lib-env.sh >/dev/null 2>&1 || true
          cd build/dyld-src/dyld
          (grep -rl 'BSD.xcconfig' . --include='*.xcconfig' | while read -r f; do sed -i '' '/BSD.xcconfig/d' "$f"; done) || true
          SRCS=$GITHUB_WORKSPACE/build/dyld-src
          INC="-idirafter $PWD/include -idirafter $GITHUB_WORKSPACE/userland/include-dyld"
          for h in _simple.h CrashReporterClient.h libc_private.h subsystem.h; do
            f=$(find "$SRCS/libplatform" "$SRCS/Libc" -name "$h" 2>/dev/null | head -1)
            [ -z "$f" ] || INC="$INC -idirafter $(dirname "$f")"
          done
          for d in libkern EXTERNAL_HEADERS bsd osfmk; do INC="$INC -idirafter $SRCS/xnu/$d"; done
          # <System/sys/reason.h> style includes: the xnu tree under a System/ prefix
          mkdir -p "$GITHUB_WORKSPACE/build/sysinc/System"
          for pair in sys:bsd/sys machine:bsd/machine kern:bsd/kern uuid:bsd/uuid mach:osfmk/mach libkern:libkern; do
            ln -sfn "$SRCS/xnu/${pair#*:}" "$GITHUB_WORKSPACE/build/sysinc/System/${pair%%:*}"
          done
          f=$(find "$SRCS/Libc" -name atexit.h | head -1); [ -z "$f" ] || ln -sfn "$f" "$GITHUB_WORKSPACE/build/sysinc/System/atexit.h"
          # second System/ root: <System/machine/cpu_capabilities.h> lives in osfmk
          mkdir -p "$GITHUB_WORKSPACE/build/sysinc2/System"
          ln -sfn "$SRCS/xnu/osfmk/machine" "$GITHUB_WORKSPACE/build/sysinc2/System/machine"
          INC="$INC -idirafter $GITHUB_WORKSPACE/build/sysinc -idirafter $GITHUB_WORKSPACE/build/sysinc2 -idirafter $GITHUB_WORKSPACE/userland/include"
          INC="$INC -idirafter $GITHUB_WORKSPACE/tools/dsc-shim"
          # the PrebuiltLoader hash script runs its own clang++: give it the same private header paths
          sed -i '' 's|-Ilsl \${DERIVED_FILE_DIR}|-Ilsl ${DYLD_EXTRA_INC} ${DERIVED_FILE_DIR}|' build-scripts/prebuilt-loader-hash.sh
          grep -q DYLD_EXTRA_INC build-scripts/prebuilt-loader-hash.sh
          # generated SDK headers: dyld/VersionMap.h and the version constants of dyld_priv.h
          AV=$SRCS/AvailabilityVersions
          mkdir -p "$GITHUB_WORKSPACE/build/sysinc/dyld"
          ruby "$AV/build_version_map.rb" "$AV/availability.pl" > "$GITHUB_WORKSPACE/build/sysinc/dyld/VersionMap.h"
          ruby "$AV/print_dyld_os_versions.rb" "$AV/availability.pl" > "$GITHUB_WORKSPACE/build/for_dyld_priv.inc"
          python3 - include/mach-o/dyld_priv.h "$GITHUB_WORKSPACE/build/for_dyld_priv.inc" <<'PY'
          import sys
          src = open(sys.argv[1]).read().split('\n')
          inc = open(sys.argv[2]).read()
          out = [inc if '@VERSION_DEFS' in l else l for l in src]
          open(sys.argv[1], 'w').write('\n'.join(out))
          PY
          grep -c dyld_platform_version_macOS_13_0 include/mach-o/dyld_priv.h
          BR="-D__API_AVAILABLE_PLATFORM_bridgeos(x)=bridgeos,introduced=x -D__API_UNAVAILABLE_PLATFORM_bridgeos=bridgeos,unavailable"
          INC="$INC $BR"
          # the stock tool needs the closed Bom framework: swap in our driver around the MRM interface
          cp "$GITHUB_WORKSPACE/tools/dsc-driver.cpp" cache-builder/dyld_shared_cache_builder.mm
          python3 "$GITHUB_WORKSPACE/tools/dsc-patch.py"
          # ... and drop the Bom framework from its link line
          sed -i '' '/Bom.framework in Frameworks/d' dyld.xcodeproj/project.pbxproj
          echo "include flags: $INC"
          SDKP=$(xcrun --sdk macosx --show-sdk-path)
          xcodebuild build -sdk macosx -target dyld_shared_cache_builder SDKROOT=macosx DYLD_EXTRA_INC="$INC" ARM_SDK="$SDKP" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=13.0 CODE_SIGN_IDENTITY=- GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS="\$(inherited) $INC" OTHER_CPLUSPLUSFLAGS="\$(inherited) $INC -include vector -include cstdint -include cstdlib -include cstring -include array -include algorithm -include string -include $GITHUB_WORKSPACE/tools/dsc-shim/dsc_compat.h" \
            OBJROOT="$GITHUB_WORKSPACE/build/dsc.obj" SYMROOT="$GITHUB_WORKSPACE/build/dsc.sym" \
            RC_ProjectSourceVersion=1 RC_ProjectNameAndSourceVersion=dyld-1066.10 \
            2>&1 | tee "$GITHUB_WORKSPACE/build/dsc-build.log" | tail -n 400
          test -x "$GITHUB_WORKSPACE/build/dsc.sym/Release/dyld_shared_cache_builder" || test -x "$GITHUB_WORKSPACE/build/dsc.sym/Debug/dyld_shared_cache_builder"

      - name: Userland root (latest successful userland-arm64 run)
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow userland-arm64.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "userland from run $id"
          gh run download "$id" -n userland-arm64-root -D build/root
          # one entry per dylib, under its install name (the artifact has copies where the root has symlinks)
          (cd build/root && find usr/lib -name '*.dylib' -type f | sort) | while read -r f; do
            name=$(otool -D "build/root/$f" | tail -1)
            if [ "$name" = "/$f" ]; then echo "/$f"; else echo "skip /$f (install name $name)" >&2; fi
          done > build/dylibs.txt
          wc -l build/dylibs.txt
          cat build/dylibs.txt

      - name: Why are libc++, libc++abi and libunwind ineligible?
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          for f in usr/lib/libc++.1.dylib usr/lib/libc++abi.1.dylib usr/lib/system/libunwind.dylib usr/lib/libz.1.dylib usr/lib/system/libsystem_c.dylib; do
            echo "=== $f"; ls -l "build/root/$f"
            otool -hv "build/root/$f" | tail -2
            otool -l "build/root/$f" | grep -E "^ *cmd |SPLIT" | sort | uniq -c | sort -rn | head -20
          done

      - name: Experiment - does install_name_tool or codesign drop LC_SEGMENT_SPLIT_INFO?
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          cnt() { otool -l "$1" | grep -c LC_SEGMENT_SPLIT_INFO || true; }
          cp build/root/usr/lib/libz.1.dylib build/z.dylib
          echo "libz original: $(cnt build/z.dylib)"
          install_name_tool -id /usr/lib/libz.1.dylib build/z.dylib
          echo "after install_name_tool -id: $(cnt build/z.dylib)"
          codesign --force -s - build/z.dylib
          echo "after codesign: $(cnt build/z.dylib)"

      - name: Experiment - linker flags for LC_SEGMENT_SPLIT_INFO
        continue-on-error: true
        run: |
          xcrun ld -help 2>&1 | grep -i -B1 -A3 "split" | head -30
          cd build
          printf 'int f(void){return 1;}\nint g = 2;\nint *p = &g;\n' > t.c
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          for fl in "" "-Wl,-add_split_seg_info" "-Wl,-ld_classic"; do
            xcrun clang -target arm64-apple-macos13.0 -isysroot "$SDK" -dynamiclib -nostdlib -lSystem $fl t.c -o t.dylib 2>&1 | head -3
            echo "flags [$fl]: split info = $(otool -l t.dylib | grep -c LC_SEGMENT_SPLIT_INFO)"
          done

      - name: Build the shared cache
        id: cache
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          tool=$(ls build/dsc.sym/*/dyld_shared_cache_builder | head -1)
          "$tool" build/cache build/root build/dylibs.txt arm64 2>&1 | tee build/dsc-run.log | tail -n 200
          ls -l build/cache

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dyld-shared-cache
          path: |
            build/cache
            build/dsc-run.log
            build/dylibs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Errors
        if: always()
        run: grep -E "error:|fatal error|\*\* BUILD" build/dsc-build.log | sort | uniq -c | sort -rn | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsc-build-log
          path: build/dsc-build.log
          retention-days: 7
