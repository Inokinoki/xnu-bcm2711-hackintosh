name: userland-boot

# Boots the userland root (artifact of the latest successful userland-arm64 run) on QEMU raspi4b with the latest
# kernel of the kernel workflow, first as a RAM disk root (rd=md0), then from an SD card image (rd=sdroot0). Runs after userland-arm64, and on its own when the image
# builder, the boot script or the root skeleton change (so those can be iterated on without a 35 minute rebuild).

on:
  workflow_dispatch:
    inputs:
      spawn:
        description: "debug: static PID 1 that runs smoke and the real init as children with DYLD_PRINT_* set"
        type: boolean
        default: false
  workflow_run:
    workflows: [userland-arm64]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "tools/mkroot.sh"
      - "tools/pi4-qemu-boot.sh"
      - "tools/mkpi_payload.py"
      - "tools/mksdimage.py"
      - "tools/mksdcard.sh"
      - "tools/pi-spawn.S"
      - "tools/mkpi-init.sh"
      - "userland/rootfs/**"
      - ".github/workflows/userland-boot.yml"

concurrency:
  group: userland-boot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  boot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install qemu aarch64-elf-gcc coreutils
          qemu-system-aarch64 --version | head -1

      - name: Userland root and kernel (latest successful runs)
        run: |
          id=$(gh run list --workflow userland-arm64.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "userland from run $id"
          gh run download "$id" -n userland-arm64-root -D build/root
          id=$(gh run list --workflow xnu-8796.141.3-bcm2711.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "kernel from run $id"
          gh run download "$id" -n xnu-8796.141.3-bcm2711-kernel -D build/kernel
          ls -l build/kernel | head

      - name: HFS+ root image
        run: |
          chmod -R u+rwX build/root
          # normally the real init is PID 1; with the spawn input a static debugging PID 1 runs smoke and the real init as children
          if [ "${{ inputs.spawn }}" = true ]; then
            SRC=pi-spawn.S CC=aarch64-elf-gcc OBJCOPY=aarch64-elf-objcopy tools/mkpi-init.sh build/spawn-init
            MKROOT_SPAWN_INIT=$PWD/build/spawn-init tools/mkroot.sh build/root build/root.img
          else
            tools/mkroot.sh build/root build/root.img
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: root-image
          path: build/root.img
          retention-days: 1

      - name: Boot on QEMU raspi4b
        id: boot
        continue-on-error: true
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          kernel=$(find build/kernel -maxdepth 1 -type f -name 'kernel.development.bcm2837' | head -1)
          # -d int logs every exception QEMU takes (ESR/FAR/ELR): the fatal user-mode fault shows up there
          QEMU_D=int,guest_errors RAMDISK=build/root.img MEM=2G CC=aarch64-elf-gcc OUT=$PWD/build/qemu tools/pi4-qemu-boot.sh "$kernel" 420

      - name: Exceptions taken from user mode (QEMU -d int)
        if: always()
        run: |
          ls -l build/qemu/qemu.log || true
          grep -c "Taking exception" build/qemu/qemu.log || true
          echo "--- sample of the log format"
          grep -m 12 -n "Taking exception" build/qemu/qemu.log || true
          echo "--- last 60 lines before the end"
          tail -n 60 build/qemu/qemu.log || true
          grep -E "from EL0|EL0 to EL1" build/qemu/qemu.log | wc -l || true
          # keep a compact copy of everything that came from EL0 for the artifact
          grep -B1 -A4 -E "from EL0|EL0 to EL1" build/qemu/qemu.log | tail -n 4000 > build/qemu/el0-exceptions.log || true

      - name: Console log
        if: always()
        run: |
          tail -n 120 build/qemu/uart1.log || true
          echo "----- markers"
          grep -E "spawn:|init: |rc: |USERLAND-SELFTEST-OK|panic|dyld|Library not loaded|Symbol not found" build/qemu/uart1.log | head -60 || true

      - name: Boot on QEMU raspi4b from the SD card (rd=sdroot0)
        id: sdboot
        continue-on-error: true
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          kernel=$(find build/kernel -maxdepth 1 -type f -name 'kernel.development.bcm2837' | head -1)
          # QEMU wants a power-of-two SD card; the raw HFS+ volume sits at sector 0 (the driver exposes the whole card)
          cp build/root.img build/sd.img
          size=$(stat -c %s build/sd.img); p=1; while [ "$p" -lt "$size" ]; do p=$((p * 2)); done
          truncate -s "$p" build/sd.img
          echo "SD image: $size bytes of HFS+ in a $p byte card"
          # QEMU raspi4b puts the card on the legacy EMMC controller (0xfe300000, the driver's default); hardware uses EMMC2
          SDIMG=build/sd.img MEM=2G CC=aarch64-elf-gcc OUT=$PWD/build/qemu-sd tools/pi4-qemu-boot.sh "$kernel" 600

      - name: Boot on QEMU raspi4b from a partitioned SD card (sdpart=2)
        id: sdpartboot
        continue-on-error: true
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          kernel=$(find build/kernel -maxdepth 1 -type f -name 'kernel.development.bcm2837' | head -1)
          # the layout of the real card: MBR, FAT32 boot partition, HFS+ root as partition 2 (QEMU only reads partition 2)
          echo "placeholder" > build/placeholder.txt
          python3 tools/mksdimage.py build/sdpart.img --root build/root.img --boot config.txt=build/placeholder.txt --boot-size 64M --pad-pow2
          SDIMG=build/sdpart.img SDPART=2 MEM=2G CC=aarch64-elf-gcc OUT=$PWD/build/qemu-sdpart tools/pi4-qemu-boot.sh "$kernel" 600

      - name: Console log (partitioned SD card boot)
        if: always()
        run: |
          tail -n 40 build/qemu-sdpart/uart1.log || true
          grep -E "BSD root|SD:|init: |USERLAND-SELFTEST-OK|panic|hfs" build/qemu-sdpart/uart1.log | head -40 || true

      - name: Assemble the Raspberry Pi 4 SD card image
        if: steps.sdpartboot.outcome == 'success'
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          OBJCOPY=aarch64-elf-objcopy tools/mksdcard.sh build/pi4-sd.img build/root.img build/qemu-sdpart
          gzip -f build/pi4-sd.img
          ls -l build/pi4-sd.img.gz

      - uses: actions/upload-artifact@v4
        if: steps.sdpartboot.outcome == 'success'
        with:
          name: pi4-sd-image
          path: build/pi4-sd.img.gz
          retention-days: 14

      - name: Console log (SD card boot)
        if: always()
        run: |
          tail -n 80 build/qemu-sd/uart1.log || true
          echo "----- markers"
          grep -E "BSD root|sdroot|SD:|init: |rc: |USERLAND-SELFTEST-OK|panic|hfs" build/qemu-sd/uart1.log | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-boot-log
          path: |
            build/qemu/uart1.log
            build/qemu/el0-exceptions.log
            build/qemu-sd/uart1.log
            build/qemu-sdpart/uart1.log
          if-no-files-found: warn
          retention-days: 14

      - name: Boot result
        run: |
          grep -q "USERLAND-SELFTEST-OK" build/qemu/uart1.log
          grep -q "rc: sort ok" build/qemu/uart1.log
          grep -q "rc: grep ok" build/qemu/uart1.log
          grep -q "rc: dev null ok" build/qemu/uart1.log
          grep -q "rc: dev zero ok" build/qemu/uart1.log
          grep -q "rc: dev tty ok" build/qemu/uart1.log
          grep -q "kern.ostype: Darwin" build/qemu/uart1.log
          grep -q "/dev/md0 on / (hfs" build/qemu/uart1.log
          grep -q "semtest: vm range probe done" build/qemu/uart1.log
          grep -q "init: bootstrap server is up" build/qemu/uart1.log
          grep -q "semtest: check_in -> 0 (port)" build/qemu/uart1.log
          grep -q "semtest: check_in again -> 1103" build/qemu/uart1.log
          grep -q "semtest: look_up -> 0 (port)" build/qemu/uart1.log
          grep -q "semtest: look_up unknown -> 1102" build/qemu/uart1.log
          grep -q "semtest: notifyd service found" build/qemu/uart1.log
          grep -q "semtest: notify_register_check -> 0" build/qemu/uart1.log
          grep -q "semtest: notify_check after post -> 0 changed 1" build/qemu/uart1.log
          grep -q "semtest: getaddrinfo -> 0 10.1.2.3" build/qemu/uart1.log
          grep -q "semtest: crypto done ALL-OK" build/qemu/uart1.log
          grep -q "semtest: message from child -> 0 id 4242 (child status 0)" build/qemu/uart1.log
          grep -q "uid=0(root)" build/qemu/uart1.log

      - name: SD card boot result
        if: always()
        run: |
          grep -q "USERLAND-SELFTEST-OK" build/qemu-sd/uart1.log
          grep -q "init: / is read-write (/dev/sdroot0)" build/qemu-sd/uart1.log
          grep -q "sdroot0 on / (hfs, local)" build/qemu-sd/uart1.log
          grep -q "semtest: crypto done ALL-OK" build/qemu-sd/uart1.log
          grep -q "semtest: notify_check after post -> 0 changed 1" build/qemu-sd/uart1.log
          grep -q "rc: sort ok" build/qemu-sd/uart1.log

      - name: Partitioned SD card boot result
        if: always()
        run: |
          grep -q "BCM2837 SD: partition 2 at sector" build/qemu-sdpart/uart1.log
          grep -q "USERLAND-SELFTEST-OK" build/qemu-sdpart/uart1.log
          grep -q "init: / is read-write (/dev/sdroot0)" build/qemu-sdpart/uart1.log
          grep -q "sdroot0 on / (hfs, local)" build/qemu-sdpart/uart1.log
          grep -q "semtest: crypto done ALL-OK" build/qemu-sdpart/uart1.log

  # Stock QEMU fixes raspi4b at 2 GiB (its board revision), so the 4 GiB layout needs QEMU built with the 4 GiB
  # revision (tools/qemu-4g.Dockerfile does the same in Docker). The build is cached.
  boot-4g:
    needs: boot
    if: always() && needs.boot.result != 'skipped' && needs.boot.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      QEMU_VERSION: "10.1.0"
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential ninja-build pkg-config python3-venv flex bison \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: QEMU with a 4 GiB raspi4b (cached)
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: ~/qemu-4g
          key: qemu-4g-${{ env.QEMU_VERSION }}-c03115-v1

      - name: Build QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL "https://download.qemu.org/qemu-$QEMU_VERSION.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/qemu-$QEMU_VERSION"
          # raspi4b: board revision c03115 = Pi 4B rev 1.5 with 4 GiB (upstream only has the 2 GiB b03115)
          grep -n 0xb03115 hw/arm/raspi4b.c
          sed -i 's/0xb03115/0xc03115/' hw/arm/raspi4b.c
          ./configure --target-list=aarch64-softmmu --disable-docs --disable-tools --disable-guest-agent --disable-werror --prefix="$HOME/qemu-4g"
          make -j"$(nproc)"
          make install

      - name: Kernel and root image
        uses: actions/download-artifact@v4
        with:
          name: root-image
          path: build/rootimg
      - run: |
          id=$(gh run list --workflow xnu-8796.141.3-bcm2711.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "kernel from run $id"
          gh run download "$id" -n xnu-8796.141.3-bcm2711-kernel -D build/kernel
          ls -l build/kernel build/rootimg

      - name: Boot on QEMU raspi4b with 4 GiB
        id: boot4g
        continue-on-error: true
        run: |
          "$HOME/qemu-4g/bin/qemu-system-aarch64" --version | head -1
          kernel=$(find build/kernel -maxdepth 1 -type f -name 'kernel.development.bcm2837' | head -1)
          QEMU="$HOME/qemu-4g/bin/qemu-system-aarch64" CC=aarch64-linux-gnu-gcc RAMDISK=build/rootimg/root.img MEM=4G \
            OUT=$PWD/build/qemu-4g tools/pi4-qemu-boot.sh "$kernel" 600

      - name: Console log (4 GiB)
        if: always()
        run: |
          tail -n 60 build/qemu-4g/uart1.log || true
          grep -a -E "hw.memsize|panic|USERLAND-SELFTEST-OK" build/qemu-4g/uart1.log | head || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-boot-log-4g
          path: build/qemu-4g/uart1.log
          if-no-files-found: warn
          retention-days: 14

      - name: 4 GiB boot result
        run: |
          grep -q "USERLAND-SELFTEST-OK" build/qemu-4g/uart1.log
          grep -q "/dev/md0 on / (hfs" build/qemu-4g/uart1.log
          grep -q "semtest: crypto done ALL-OK" build/qemu-4g/uart1.log
          grep -q "semtest: notify_check after post -> 0 changed 1" build/qemu-4g/uart1.log
          # the kernel's RAM window is 0x10000000-0xec000000 (3.44 GiB): hw.memsize must be well above the 2 GiB layout's
          mem=$(grep -a -m1 "hw.memsize:" build/qemu-4g/uart1.log | awk '{print $2}' | tr -d '\r')
          echo "hw.memsize = $mem"
          [ "${mem:-0}" -ge 3000000000 ]
