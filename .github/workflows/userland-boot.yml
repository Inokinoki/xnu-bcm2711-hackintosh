name: userland-boot

# Boots the userland root (artifact of the latest successful userland-arm64 run) on QEMU raspi4b with the latest
# kernel of the kernel workflow, as a RAM disk root. Runs after userland-arm64, and on its own when the image
# builder, the boot script or the root skeleton change (so those can be iterated on without a 35 minute rebuild).

on:
  workflow_dispatch:
    inputs:
      spawn:
        description: "debug: static PID 1 that runs smoke and the real init as children with DYLD_PRINT_* set"
        type: boolean
        default: false
  workflow_run:
    workflows: [userland-arm64]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "tools/mkroot.sh"
      - "tools/pi4-qemu-boot.sh"
      - "tools/mkpi_payload.py"
      - "tools/pi-spawn.S"
      - "tools/mkpi-init.sh"
      - "userland/rootfs/**"
      - ".github/workflows/userland-boot.yml"

concurrency:
  group: userland-boot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  boot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install qemu aarch64-elf-gcc coreutils
          qemu-system-aarch64 --version | head -1

      - name: Userland root and kernel (latest successful runs)
        run: |
          id=$(gh run list --workflow userland-arm64.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "userland from run $id"
          gh run download "$id" -n userland-arm64-root -D build/root
          id=$(gh run list --workflow xnu-8796.141.3-bcm2711.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "kernel from run $id"
          gh run download "$id" -n xnu-8796.141.3-bcm2711-kernel -D build/kernel
          ls -l build/kernel | head

      - name: HFS+ root image
        run: |
          chmod -R u+rwX build/root
          # normally the real init is PID 1; with the spawn input a static debugging PID 1 runs smoke and the real init as children
          if [ "${{ inputs.spawn }}" = true ]; then
            SRC=pi-spawn.S CC=aarch64-elf-gcc OBJCOPY=aarch64-elf-objcopy tools/mkpi-init.sh build/spawn-init
            MKROOT_SPAWN_INIT=$PWD/build/spawn-init tools/mkroot.sh build/root build/root.img
          else
            tools/mkroot.sh build/root build/root.img
          fi

      - name: Boot on QEMU raspi4b
        id: boot
        continue-on-error: true
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          kernel=$(find build/kernel -maxdepth 1 -type f -name 'kernel.development.bcm2837' | head -1)
          # -d int logs every exception QEMU takes (ESR/FAR/ELR): the fatal user-mode fault shows up there
          QEMU_D=int,guest_errors RAMDISK=build/root.img MEM=2G CC=aarch64-elf-gcc OUT=$PWD/build/qemu tools/pi4-qemu-boot.sh "$kernel" 420

      - name: Exceptions taken from user mode (QEMU -d int)
        if: always()
        run: |
          ls -l build/qemu/qemu.log || true
          grep -c "Taking exception" build/qemu/qemu.log || true
          echo "--- sample of the log format"
          grep -m 12 -n "Taking exception" build/qemu/qemu.log || true
          echo "--- last 60 lines before the end"
          tail -n 60 build/qemu/qemu.log || true
          grep -E "from EL0|EL0 to EL1" build/qemu/qemu.log | wc -l || true
          # keep a compact copy of everything that came from EL0 for the artifact
          grep -B1 -A4 -E "from EL0|EL0 to EL1" build/qemu/qemu.log | tail -n 4000 > build/qemu/el0-exceptions.log || true

      - name: Console log
        if: always()
        run: |
          tail -n 120 build/qemu/uart1.log || true
          echo "----- markers"
          grep -E "spawn:|init: |rc: |USERLAND-SELFTEST-OK|panic|dyld|Library not loaded|Symbol not found" build/qemu/uart1.log | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-boot-log
          path: |
            build/qemu/uart1.log
            build/qemu/el0-exceptions.log
          if-no-files-found: warn
          retention-days: 14

      - name: Boot result
        run: |
          grep -q "USERLAND-SELFTEST-OK" build/qemu/uart1.log
          grep -q "rc: sort ok" build/qemu/uart1.log
          grep -q "rc: grep ok" build/qemu/uart1.log
          grep -q "rc: dev null ok" build/qemu/uart1.log
          grep -q "rc: dev zero ok" build/qemu/uart1.log
          grep -q "rc: dev tty ok" build/qemu/uart1.log
          grep -q "kern.ostype: Darwin" build/qemu/uart1.log
          grep -q "/dev/md0 on / (hfs" build/qemu/uart1.log
          grep -q "semtest: vm range probe done" build/qemu/uart1.log
          grep -q "uid=0(root)" build/qemu/uart1.log
